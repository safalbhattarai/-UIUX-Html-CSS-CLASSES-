      let age = 16;
      if (age >= 18) {
        console.log("You are a adult");
      } else {
        console.log("You are a minor");
      }

      let marks = 75;

      if (marks > 75) {
        console.log("Grade A");
      } else if (marks >= 60) {

      }

      let num = 16;

      if (num % 2 == 0) {
        console.log("Even");
      } else {
        console.log("odd");
      }

      let num1 = 12;
      let num2 = "12";
      console.log(num1, typeof(num1))
      console.log(num2, typeof(num2))

      if (num1 === num2) {

      }

      for(i=5; i>=1; i--){
        console.log(i)
      }

    //   for (initialization; condition; increment / decrement) {}

      for(let a = 1; a<=10; a++){
        console.log(a)
      }
