<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>

    <p>variable type</p>
    <li>var</li>
    <li>let</li>
    <li>const </li>



    <script>

        var a ="Alu";
        console.log(a);
        a ="alu";
        console.log(a);


        let b ="Name";
        b ="krish";
        console.log(b);


        const k ="Hello";
        console.log(k);

        const age ="15";
        console.log(age);


        let exam = true;
        console.log(exam, typeof(exam))
        console.log(exam)
       

        let hell=null;
        console.log(hell)
        let j;
        console.log(j)



        let num1 =5;
        let num2 =10;
        let total=num1+num2;
        console.log (total);
        document.write(total)

        function add(x,y){
            let b=x+y
            return b
        }
        console.log(add(10,5))

    </script>
</body>
</html>
